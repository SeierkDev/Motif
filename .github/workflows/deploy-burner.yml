---
# Deploy the burner from the GitHub web UI.
#
# MotifBurner spends the protocol's 0.10% on MOTIF and burns it. Like the other
# deploys here, the key is a GitHub secret typed into GitHub's own settings page
# rather than pasted into a terminal.
#
# WHAT THIS IS NOT. It touches no contract already deployed and changes no
# address in use. The fee wallet it pulls from is not an input: the script reads
# `protocolFeeTo` off the live router, so the one address that must not be wrong
# cannot be mistyped here.
#
# WHO OWNS THE RESULT. Nobody. The burner has no owner, no settings and no
# withdrawal, so whichever key signs this gains nothing by having signed it.
# Deploying it moves nothing either: it can do nothing at all until the fee
# wallet approves it, which is a separate transaction that wallet signs itself.
#
# It never runs on a push. Actions -> deploy burner -> Run workflow.

name: deploy burner

on:
  workflow_dispatch:
    inputs:
      rpc_url:
        description: "RPC to deploy against"
        required: true
        default: "https://rpc.mainnet.chain.robinhood.com"
      router:
        description: "The router that is already live. Its protocolFeeTo is what the burner pulls from."
        required: true
        default: "0x7fAD2ADb589a07867477D40c142181151549AAcd"
      confirm:
        description: "Type deploy to confirm. Real gas, cannot be undone."
        required: true
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Before anything is built, so a misclick costs nothing.
      - name: check the confirmation and the router
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Not confirmed. Type deploy in the confirm box to run this."
            exit 1
          fi
          if ! echo "${{ inputs.router }}" | grep -Eq '^0x[0-9a-fA-F]{40}$'; then
            echo "router is not a 20 byte address: '${{ inputs.router }}'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1

      # OpenZeppelin is vendored by clone rather than as a submodule, the same
      # way every other workflow here does it.
      - run: test -d lib/openzeppelin-contracts || git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - run: forge build

      - name: check the key and what it holds
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "The DEPLOY_PRIVATE_KEY secret is not set."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          addr=$(cast wallet address --private-key "$PRIVATE_KEY")
          bal=$(cast balance "$addr" --rpc-url "${{ inputs.rpc_url }}")
          echo "deployer $addr"
          echo "balance  $bal wei"
          echo "DEPLOYER=$addr" >> "$GITHUB_ENV"
          echo "BALANCE_WEI=$bal" >> "$GITHUB_ENV"

      # Forge's own estimate from a real dry run, a quarter over it required,
      # for the reasons written out in deploy-factory.yml.
      - name: estimate the cost against the balance
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          MOTIF_ROUTER: ${{ inputs.router }}
        run: |
          set -o pipefail
          forge script script/DeployBurner.s.sol:DeployBurner \
            --rpc-url "${{ inputs.rpc_url }}" \
            --private-key "$PRIVATE_KEY" 2>&1 | tee /tmp/estimate.log || true

          need=$(grep -Eo 'Estimated amount required: [0-9.]+' /tmp/estimate.log | tail -1 | awk '{print $NF}' || true)
          if [ -z "$need" ]; then
            echo "::warning::Could not read an estimate from the dry run. Going on anyway."
            echo "NEED_ETH=unknown" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "NEED_ETH=$need" >> "$GITHUB_ENV"
          have=$(cast from-wei "$BALANCE_WEI")
          echo "estimated $need ETH, holding $have ETH"
          python3 - "$need" "$have" <<'PY'
          import sys
          need, have = float(sys.argv[1]), float(sys.argv[2])
          if have < need * 1.25:
              print(f"Not enough gas. Estimated {need} ETH, holding {have}. "
                    f"Top up past {need * 1.25:.6f} and run this again.")
              raise SystemExit(1)
          PY

      - name: deploy
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          MOTIF_ROUTER: ${{ inputs.router }}
        run: |
          set -o pipefail
          forge script script/DeployBurner.s.sol:DeployBurner \
            --rpc-url "${{ inputs.rpc_url }}" \
            --private-key "$PRIVATE_KEY" \
            --broadcast --slow -vvv 2>&1 | tee /tmp/deploy.log

      # The address from the broadcast record, then the contract asked back
      # what it will pull from and what it will burn. Reading the deployment
      # back is the rule this repo applies to every address it records.
      - name: read the deployment back
        run: |
          set -euo pipefail
          burner=$(python3 - <<'PY'
          import glob, json
          runs = sorted(glob.glob('broadcast/DeployBurner.s.sol/*/run-latest.json'))
          data = json.load(open(runs[-1])) if runs else {}
          for t in data.get('transactions', []):
              if t.get('contractName') == 'MotifBurner' and t.get('contractAddress'):
                  print(t['contractAddress'])
                  break
          PY
          )
          if [ -z "$burner" ]; then
            echo "## Deploy finished but no MotifBurner is in the broadcast record" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          rpc="${{ inputs.rpc_url }}"
          size=$(cast codesize "$burner" --rpc-url "$rpc")
          source=$(cast call "$burner" 'source()(address)' --rpc-url "$rpc")
          token=$(cast call "$burner" 'motif()(address)' --rpc-url "$rpc")
          fee_to=$(cast call "${{ inputs.router }}" 'protocolFeeTo()(address)' --rpc-url "$rpc")
          echo "BURNER=$burner" >> "$GITHUB_ENV"

          {
            echo "## Deployed"
            echo
            echo "MotifBurner \`$burner\`, $size bytes, deployer \`$DEPLOYER\`."
            echo
            echo "- pulls from \`$source\`, the router's protocolFeeTo \`$fee_to\`"
            echo "- burns \`$token\`"
            echo
            echo "**1.** Set this on the api service, then restart it:"
            echo
            echo '```'
            echo "MOTIF_BURNER=$burner"
            echo '```'
            echo
            echo "**2.** Then, from \`$source\` and from no other wallet, approve it to pull USDG:"
            echo
            echo '```'
            echo "cast send 0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168 \"approve(address,uint256)\" $burner 115792089237316195423570985008687907853269984665640564039457584007913129639935 --rpc-url $rpc --private-key <the fee wallet key>"
            echo '```'
            echo
            echo "Nothing burns until both are done. Check \`keeper.burn\` on the api's \`/v1/status\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(echo "$source" | tr A-F a-f)" != "$(echo "$fee_to" | tr A-F a-f)" ]; then
            echo "::error::The burner pulls from $source but the router pays $fee_to. Do not approve it."
            exit 1
          fi

      # broadcast/ is gitignored, so without this the only record of what
      # landed and where dies with the runner.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broadcast-record
          path: broadcast/
          if-no-files-found: warn

      - name: report
        if: always()
        run: |
          echo "=============================="
          echo "deployer     ${DEPLOYER:-not derived, the key was missing}"
          echo "balance wei  ${BALANCE_WEI:-not read}"
          echo "estimated    ${NEED_ETH:-not read} ETH"
          echo "burner       ${BURNER:-not deployed}"
          echo "=============================="
          echo "last of the forge output:"
          tail -25 /tmp/deploy.log 2>/dev/null || echo "  the deploy step never ran"
          echo "=============================="
